[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "depth-radar-desktop"
version = "0.1.0"
description = "Depth Radar V4 Desktop Application — NQ MBO Wall Monitor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.scripts]
depth-radar-desktop = "depth_radar_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["depth_radar_desktop*"]
