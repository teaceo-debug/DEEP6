<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>GEX Doctor v2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 800px; height: 800px;
      background: #0D0D0D;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      color: #00FF41;
      overflow: hidden;
    }
    .title { font-size: 24px; font-weight: bold; margin-bottom: 16px;
      text-shadow: 0 0 12px #00FF41; }
    .subtitle { font-size: 13px; color: #00AA00; margin-bottom: 32px; }
    .status { font-size: 12px; color: #00AA00; }
    .dots { display: inline-block; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .dot { animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .border {
      position: absolute; inset: 0;
      border: 1px solid #00FF41;
      box-shadow: 0 0 15px rgba(0,255,65,0.3), inset 0 0 10px rgba(0,255,65,0.05);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="border"></div>
  <div class="title">GEX DOCTOR v2.0</div>
  <div class="subtitle">Institutional Options Bias Terminal</div>
  <div class="status">Starting data engine<span class="dots">
    <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </span></div>
</body>
</html>
