[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep6v2"
version = "2.0.0-dev"
description = "DEEP6 v2.0 — Python-native clean room package scaffold"
requires-python = ">=3.12"
dependencies = [
    "async-rithmic==1.5.9",
    "polygon-api-client>=1.14",
    "anthropic>=0.40",
    "scipy>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog",
    "aiosqlite",
    "duckdb",
    "janus",
    "numpy",
    "uvicorn",
    "fastapi",
    "httpx",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark",
]

[project.scripts]
deep6v2 = "deep6v2.__main__:cli_entry"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_v2"]
markers = [
    "integration: tests that require external services or credentials",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deep6v2*", "nq_atlas*"]
